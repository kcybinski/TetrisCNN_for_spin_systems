name: tetriscnn
channels:
  - conda-forge
  - defaults
dependencies:
  # --- Core language / scientific stack (conda-forge builds are well-tested here) ---
  - python=3.11          # matches the verified reference environment (3.11.14); minor version
                          # pinned because that's what the code has actually been run/tested on,
                          # patch version left free
  - numpy>=2.0            # torch>=2.2 wheels are numpy-2 compatible; older numpy (<2 ABI) is not
                           # mixed-and-matched here, so this floor is a genuine (not cosmetic) pin
  - scipy>=1.13
  - pandas>=2.2
  - matplotlib>=3.8       # mpl_toolkits (mplot3d, used for the SR 3D generalization plots) ships
                           # inside the matplotlib package itself -- no separate dependency needed
  - scikit-learn>=1.5
  - seaborn>=0.13          # used throughout tetriscnn/utils.py, plots.py, symbolic_regression.py
  - sympy>=1.13            # equation printing/manipulation in tetriscnn/symbolic_regression.py
  - statsmodels>=0.14
  - tqdm>=4.66

  # --- Figure-generation / notebook extras ---
  # Not imported by tetriscnn/ itself, but required to run the repo's *.ipynb figure notebooks
  # and scripts/, which the public-release audit treats as part of "installing the project".
  - scikit-image>=0.22     # `from skimage import measure` (marching-cubes / contour extraction)
                            # in scripts/fig6_surface_survey.py and the Figures5_6_combined_pipeline.ipynb /
                            # Figure6.ipynb 3D-surface figures; floor is loose since only the
                            # long-stable `measure` API is used
  - ipython>=8.0            # `from IPython.display import Math, display` in the Figure5/Figure6
                            # notebooks to render LaTeX-typeset symbolic-regression equations
                            # inline; floor is loose, this API has been stable for many releases
  - ipywidgets>=8.0         # optional: Figures5_6_combined_pipeline.ipynb's interactive elev/azim slider for
                            # picking a 3D view angle. The notebook's own import is try/except-
                            # guarded and falls back to a static contact sheet if this is absent
  - umap-learn>=0.5         # `import umap` -- a hard (non-optional) top-level import in
                            # FiguresApp_E_clustering.ipynb
  - jupyterlab>=4.0         # the `jupyter lab` / `python -m jupyter nbconvert` commands docs/
                            # NOTEBOOKS.md and the README document for running the figure
                            # notebooks; pulls in ipykernel and nbconvert. Nothing else in this
                            # file provides the `jupyter` command itself.

  - typing_extensions      # carried over from the previous env file; no first-party module
                           # imports it directly today, but it's a common transitive pin for
                           # several of the above (harmless to keep explicit)
  - tk                     # provides the OS-level Tk/Tcl libraries that Python's stdlib `tkinter`
                           # binds to; required for tetriscnn/utils.py:pick_directory()'s
                           # non-notebook directory-picker dialog (tkinter itself is stdlib and
                           # does not appear in this file, but it is non-functional without this)
  - pip
  - pip:
      # --- Deep learning backend ---
      - torch>=2.2,<3      # reference environment uses 2.9.1; no first-party code depends on a
                            # feature newer than what's been available since ~2.2, so the floor is
                            # loose. Installed via pip (not conda-forge's pytorch package) since
                            # pip wheels are what's actually verified, and it keeps CPU/CUDA/MPS
                            # wheel selection under pip's normal platform-selection logic. Users
                            # who need a specific CUDA build should instead follow the install
                            # command generator at https://pytorch.org/get-started/locally/ and
                            # skip this line.

      # --- File-picker extra ---
      - ipyfilechooser>=0.6  # tetriscnn/utils.py:pick_directory()'s Jupyter-notebook code path

# --- Symbolic regression (optional) ---
# PySR (with the Julia runtime it bootstraps on first use) and plotly, used only for the SR
# plots, are deliberately NOT part of this environment: symbolic regression is an optional route run separately via sr_toolbox.py
# (docs/SYMBOLIC_REGRESSION.md). To add it to this environment:
#     conda activate tetriscnn && pip install -r requirements-sr.txt
# requirements-sr.txt carries the version pin and the Julia / import-order notes.
